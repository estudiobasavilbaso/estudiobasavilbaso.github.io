<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="El libro de cuentas del dragon: registro de consecuencias de campana para DMs, con vencimiento en dias de juego.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Deudas de Campaña</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:wght@400;500;700&family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* ===== El libro de cuentas del dragón =====================================
   Oscuro por defecto: esto se lee a la luz de una vela. El tema claro es
   vitela gastada, no papel blanco.
   ========================================================================= */
:root{
  --abismo:#0C0A09; --pergamino:#16110F; --pergamino-2:#1E1714; --hundido:#080605;
  --hueso:#EDE0C8; --hueso-soft:#C3B295; --ceniza:#8A7B68;
  --filo:#35281F; --filo-soft:#241B16;
  --oro:#D4A83C; --oro-hondo:#8C6A1E; --oro-tenue:rgba(212,168,60,.13);
  --brasa:#D0512F; --sangre:#7E1F14; --jade:#56A07C; --ambar:#DE9C36;
  --oro-texto:#1A1207; --sombra:rgba(0,0,0,.6);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --abismo:#DBD2B8; --pergamino:#E8E1CB; --pergamino-2:#F0EADA; --hundido:#CDC3A6;
    --hueso:#241C14; --hueso-soft:#4A3C2C; --ceniza:#6E5F4A;
    --filo:#BCAF95; --filo-soft:#CEC4AB;
    --oro:#8A6512; --oro-hondo:#6B4E0C; --oro-tenue:rgba(138,101,18,.12);
    --brasa:#9E3319; --sangre:#7E1F14; --jade:#2F6B4A; --ambar:#8E5B0E;
    --oro-texto:#F5EEDD; --sombra:rgba(60,44,20,.22);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --abismo:#DBD2B8; --pergamino:#E8E1CB; --pergamino-2:#F0EADA; --hundido:#CDC3A6;
  --hueso:#241C14; --hueso-soft:#4A3C2C; --ceniza:#6E5F4A;
  --filo:#BCAF95; --filo-soft:#CEC4AB;
  --oro:#8A6512; --oro-hondo:#6B4E0C; --oro-tenue:rgba(138,101,18,.12);
  --brasa:#9E3319; --sangre:#7E1F14; --jade:#2F6B4A; --ambar:#8E5B0E;
  --oro-texto:#F5EEDD; --sombra:rgba(60,44,20,.22);
  color-scheme:light;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--abismo); color:var(--hueso);
  font-family:"EB Garamond",Georgia,serif; font-size:17px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit}
svg{display:block}
.wrap{max-width:1020px;margin:0 auto;padding-inline:20px}

/* etiquetas en versalitas: la voz "de manual" */
.rotulo{
  font-family:"Alegreya Sans SC","Archivo",sans-serif;
  text-transform:uppercase; letter-spacing:.13em; font-size:12px; font-weight:500;
  color:var(--ceniza);
}
.titulo{font-family:"Cinzel",Georgia,serif;font-weight:600;letter-spacing:.01em}

/* ===== escamas: textura de fondo del encabezado ===== */
.escamas{
  background-image:
    radial-gradient(circle at 50% 100%, transparent 57%, var(--oro-tenue) 58%, transparent 61%),
    radial-gradient(circle at 50% 100%, transparent 57%, var(--oro-tenue) 58%, transparent 61%);
  background-size:26px 14px;
  background-position:0 0, 13px 7px;
}

/* ===== encabezado ===== */
.masthead{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
  background:var(--pergamino);
  border-bottom:1px solid var(--filo);
  box-shadow:0 1px 0 var(--oro-tenue), 0 10px 24px -18px var(--sombra);
}
.masthead::before{
  content:""; position:absolute; inset:0; pointer-events:none; opacity:.55;
  background-image:
    radial-gradient(circle at 50% 100%, transparent 57%, var(--oro-tenue) 58%, transparent 61%),
    radial-gradient(circle at 50% 100%, transparent 57%, var(--oro-tenue) 58%, transparent 61%);
  background-size:26px 14px; background-position:0 0, 13px 7px;
  -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,.9), transparent 78%);
  mask-image:linear-gradient(to bottom, rgba(0,0,0,.9), transparent 78%);
}
.masthead .wrap{position:relative;padding-block:14px 0}
.mrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between}
.sello{display:flex;align-items:center;gap:13px;min-width:0}
.sello h1{font-family:"Cinzel",Georgia,serif;font-size:23px;font-weight:700;letter-spacing:.02em;line-height:1.1}
.sello .sub{display:block;margin-top:2px}

/* el ojo mira: se abre y enrojece cuando hay cuentas vencidas */
.ojo{width:56px;height:38px;flex:0 0 auto}
.ojo .lente{fill:var(--hundido);stroke:var(--oro-hondo);stroke-width:1.4}
.ojo .iris{fill:url(#irisCalma);stroke:var(--oro-hondo);stroke-width:.8}
.ojo .pupila{fill:#08060A;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.ojo .brillo{fill:var(--hueso);opacity:.55}
.ojo .rayo{stroke:var(--oro-hondo);stroke-width:1.1;opacity:.5}
.ojo.alerta .iris{fill:url(#irisFuria)}
.ojo.alerta .pupila{transform:scaleX(2.1);transform-origin:30px 20px}
.ojo.alerta .rayo{stroke:var(--brasa);opacity:.85}
.ojo.alerta{animation:latir 2.6s ease-in-out infinite}
@keyframes latir{0%,100%{filter:drop-shadow(0 0 0 transparent)}50%{filter:drop-shadow(0 0 7px rgba(208,81,47,.55))}}

.relojes{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dial{
  display:inline-flex;align-items:baseline;gap:7px;
  border:1px solid var(--filo);border-radius:2px;padding:5px 11px;
  background:var(--pergamino-2);
}
.dial .k{font-family:"Alegreya Sans SC",sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--ceniza)}
.dial .v{font-family:"Cinzel",Georgia,serif;font-size:17px;font-weight:700;color:var(--oro);font-variant-numeric:tabular-nums}

/* pestañas como lengüetas de tomo */
.tabs{display:flex;gap:4px;margin-top:13px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  appearance:none;background:transparent;border:1px solid transparent;border-bottom:0;
  border-radius:4px 4px 0 0;padding:9px 15px 10px;cursor:pointer;white-space:nowrap;
  font-family:"Alegreya Sans SC",sans-serif;text-transform:uppercase;letter-spacing:.1em;
  font-size:13px;font-weight:500;color:var(--ceniza);position:relative;top:1px;
  transition:color .15s ease,background .15s ease;
}
.tab:hover{color:var(--hueso);background:var(--oro-tenue)}
.tab[aria-selected="true"]{
  color:var(--oro);background:var(--abismo);
  border-color:var(--filo);box-shadow:0 -1px 0 var(--oro-hondo) inset;
}
.tab .cnt{font-family:"Cinzel",serif;font-size:12px;margin-left:6px;font-variant-numeric:tabular-nums}
.tab.alarma .cnt{color:var(--brasa)}

/* ===== estructura ===== */
main{padding-block:30px 70px}
.lead{max-width:60ch;color:var(--hueso-soft);font-size:17.5px}
.lead em{color:var(--oro);font-style:italic}

.seccion{display:flex;align-items:center;gap:14px;margin-block:38px 4px}
.seccion .rotulo{white-space:nowrap}
.seccion .hilo-oro{flex:1;height:1px;background:linear-gradient(to right,var(--oro-hondo),transparent)}
.seccion:first-child{margin-top:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:18px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}

/* ===== la entrada: una cuenta anotada ===== */
.entry{
  display:grid;grid-template-columns:104px 1fr;gap:22px;
  padding:20px 20px 20px 18px;margin-top:12px;
  background:var(--pergamino);
  border:1px solid var(--filo-soft);border-left:3px solid var(--filo);
  border-radius:3px;
  transition:border-left-color .18s ease,transform .18s ease,box-shadow .18s ease;
}
.entry:hover{transform:translateX(2px);box-shadow:-3px 0 16px -6px var(--sombra)}
.entry.e-vencida{border-left-color:var(--brasa)}
.entry.e-inminente{border-left-color:var(--ambar)}
.entry.e-camino{border-left-color:var(--oro-hondo)}
.entry.e-lejana{border-left-color:var(--filo)}
.entry.e-bien{border-left-color:var(--jade)}
.entry.gone{opacity:.42}
.entry.nueva{animation:desplegar .45s ease both}
@keyframes desplegar{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

.cuando{display:flex;flex-direction:column;gap:9px;align-items:flex-start}
.cuando .dia{
  font-family:"Cinzel",Georgia,serif;font-size:15px;font-weight:700;color:var(--hueso);
  font-variant-numeric:tabular-nums;line-height:1;
}
.cuando .dia b{display:block;font-size:30px;color:var(--oro);letter-spacing:-.01em;margin-top:3px}
.cuando .resta{font-family:"Alegreya Sans SC",sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--ceniza)}

/* mecha: cuánto se quemó del plazo */
.mecha{width:100%;max-width:104px;height:3px;background:var(--hundido);border-radius:2px;position:relative;overflow:visible}
.mecha i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:linear-gradient(to right,var(--oro-hondo),var(--ambar))}
.mecha.arde i{background:linear-gradient(to right,var(--ambar),var(--brasa))}
.mecha svg{position:absolute;top:-6px;width:11px;height:14px;transform:translateX(-50%)}

.cuerpo h3{font-family:"Cinzel",Georgia,serif;font-size:20px;font-weight:600;line-height:1.25;margin-bottom:6px}
.cuerpo .texto{font-size:17.5px;line-height:1.58;max-width:58ch;color:var(--hueso)}
.cuerpo .tono{font-style:italic;color:var(--oro);opacity:.92;font-size:16.5px;margin-top:5px;max-width:58ch}

.meta{
  display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:11px;
  font-family:"Alegreya Sans SC",sans-serif;text-transform:uppercase;letter-spacing:.09em;
  font-size:11.5px;color:var(--ceniza);
}
.meta .sep{opacity:.4}
.meta .quien{color:var(--hueso-soft)}
.llamas{display:inline-flex;gap:2px;align-items:center;vertical-align:-2px}
.llamas svg{width:9px;height:11px}
.llamas .off{opacity:.22}

.tag{
  font-family:"Alegreya Sans SC",sans-serif;text-transform:uppercase;letter-spacing:.1em;
  font-size:11px;border:1px solid var(--filo);border-radius:2px;padding:2px 7px;color:var(--ceniza);
}
.tag.bien{color:var(--jade);border-color:var(--jade)}

/* sellos de estado */
.sigilo{
  font-family:"Alegreya Sans SC",sans-serif;text-transform:uppercase;letter-spacing:.12em;
  font-size:11px;font-weight:700;padding:3px 8px;border-radius:2px;border:1px solid currentColor;
  display:inline-block;
}
.g-vencida{color:var(--brasa);border-width:2px;border-style:double;transform:rotate(-2.5deg);
  background:rgba(208,81,47,.08)}
.g-inminente{color:var(--ambar)}
.g-camino{color:var(--oro)}
.g-lejana{color:var(--ceniza)}
.g-usada{color:var(--ceniza);opacity:.8}

.presagio{
  display:inline-flex;align-items:center;gap:5px;color:var(--oro);
  font-family:"Cinzel",serif;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;
}
.presagio svg{width:13px;height:13px}

.si-ignoran{
  margin-top:12px;padding:10px 14px;max-width:58ch;
  background:var(--hundido);border-left:2px solid var(--sangre);border-radius:2px;
  font-size:16px;color:var(--hueso-soft);
}
.si-ignoran b{display:block;margin-bottom:2px;
  font-family:"Alegreya Sans SC",sans-serif;text-transform:uppercase;letter-spacing:.12em;
  font-size:11px;font-weight:500;color:var(--brasa)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* ===== controles forjados ===== */
.btn{
  appearance:none;cursor:pointer;border-radius:3px;
  background:var(--pergamino-2);border:1px solid var(--filo);color:var(--hueso);
  padding:8px 14px;font-family:"Alegreya Sans SC",sans-serif;font-size:13.5px;
  text-transform:uppercase;letter-spacing:.09em;font-weight:500;
  transition:border-color .15s ease,color .15s ease,background .15s ease,transform .1s ease;
}
.btn:hover{border-color:var(--oro);color:var(--oro);background:var(--oro-tenue)}
.btn:active{transform:translateY(1px)}
.btn.oro{background:linear-gradient(to bottom,var(--oro),var(--oro-hondo));border-color:var(--oro-hondo);color:var(--oro-texto);font-weight:700}
.btn.oro:hover{filter:brightness(1.12);color:var(--oro-texto)}
.btn.fantasma{background:transparent;border-color:transparent;color:var(--ceniza);padding-inline:9px}
.btn.fantasma:hover{color:var(--hueso);background:var(--oro-tenue);border-color:transparent}
.btn.peligro:hover{border-color:var(--brasa);color:var(--brasa);background:rgba(208,81,47,.08)}
.btn.chico{font-size:12px;padding:5px 10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.conicono{display:inline-flex;align-items:center;gap:8px}
.btn.conicono svg{width:16px;height:16px}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--oro);outline-offset:2px;
}

input[type=text],input[type=number],select,textarea{
  background:var(--hundido);border:1px solid var(--filo);border-radius:2px;
  padding:8px 10px;font-size:16px;width:100%;font-family:"EB Garamond",Georgia,serif;
}
input[type=number]{font-variant-numeric:tabular-nums}
textarea{line-height:1.6;resize:vertical}
label.campo{display:flex;flex-direction:column;gap:5px;flex:1 1 180px;min-width:0}
label.campo > span:first-child{
  font-family:"Alegreya Sans SC",sans-serif;text-transform:uppercase;letter-spacing:.12em;
  font-size:11.5px;color:var(--ceniza);
}
.ayuda{font-size:14.5px;color:var(--ceniza);max-width:60ch}
.panel{border:1px solid var(--filo);border-radius:3px;background:var(--pergamino);padding:20px}
.panel.liso{background:transparent;border-color:var(--filo-soft)}

/* ===== propuestas: lo que el dragón dictó ===== */
.prop{
  border:1px solid var(--oro-hondo);border-radius:3px;padding:18px 20px;margin-top:12px;
  background:linear-gradient(to bottom right,var(--pergamino-2),var(--pergamino));
  box-shadow:0 0 0 1px var(--oro-tenue) inset;
  animation:surgir .5s ease both;
}
@keyframes surgir{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.prop h3{font-family:"Cinzel",Georgia,serif;font-size:19px;font-weight:600}
.prop .texto{font-size:17px;line-height:1.55;max-width:58ch;margin-top:6px}

/* fichas del mundo */
.gente{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:12px;margin-top:12px}
.ficha{
  border:1px solid var(--filo-soft);border-radius:3px;background:var(--pergamino);
  padding:15px 16px;transition:border-color .16s ease;
}
.ficha:hover{border-color:var(--oro-hondo)}
.ficha .nm{font-family:"Cinzel",Georgia,serif;font-size:17.5px;font-weight:600}
.ficha .nm.muerto{text-decoration:line-through;text-decoration-color:var(--brasa);opacity:.7}
.ficha .ln{margin-top:3px}
.ficha .nt{font-size:15.5px;color:var(--hueso-soft);margin-top:7px;font-style:italic}
.animo{display:flex;align-items:center;gap:8px;margin-top:9px}
.animobar{height:4px;flex:1;max-width:120px;background:var(--hundido);border-radius:2px;position:relative}
.animobar span{position:absolute;top:0;bottom:0;left:0;border-radius:2px}

.vacio{
  border:1px dashed var(--filo);border-radius:3px;padding:30px 22px;text-align:center;
  color:var(--ceniza);font-size:16px;margin-top:12px;
}
.vacio b{display:block;font-family:"Cinzel",Georgia,serif;font-size:19px;color:var(--hueso);margin-bottom:6px}
.aviso{border-left:2px solid var(--ambar);padding-left:13px;color:var(--hueso-soft);font-size:15.5px}

.lineafila{
  display:grid;grid-template-columns:1fr 168px 200px 104px;gap:11px;align-items:end;
  padding-block:13px;border-top:1px solid var(--filo-soft);
}
.bitacora{margin-top:12px}
.bit{display:grid;grid-template-columns:104px 1fr;gap:22px;padding-block:15px;border-top:1px solid var(--filo-soft)}
.bit ul{margin:0;padding-left:18px;font-size:16.5px}
.bit li{margin-block:3px}
.bit li::marker{color:var(--oro-hondo)}

.pie{
  border-top:1px solid var(--filo);margin-top:54px;padding-block:20px 8px;
  display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;align-items:center;
  color:var(--ceniza);font-size:14.5px;
}

/* ===== diálogos ===== */
.overlay{
  position:fixed;inset:0;z-index:80;background:rgba(6,4,3,.72);backdrop-filter:blur(2px);
  display:flex;align-items:flex-start;justify-content:center;
  padding:max(26px,env(safe-area-inset-top,0px)) 16px 26px;overflow-y:auto;
  animation:aparecer .18s ease both;
}
@keyframes aparecer{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--pergamino);border:1px solid var(--oro-hondo);border-radius:4px;
  box-shadow:0 22px 60px var(--sombra), 0 0 0 1px var(--oro-tenue) inset;
  width:min(470px,100%);margin-block:auto;padding:24px;
  animation:subir .22s ease both;
}
@keyframes subir{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.modal h3{font-family:"Cinzel",Georgia,serif;font-size:21px;font-weight:600;margin-bottom:5px}
.modal .mtxt{color:var(--hueso-soft);font-size:16px;margin-bottom:18px;white-space:pre-line}
.modal .mcampos{display:flex;flex-direction:column;gap:15px}
.modal .mcampos > label.campo{flex:0 0 auto}
.modal .mopt{font-size:14.5px;color:var(--ceniza);margin-top:3px;
  font-family:"EB Garamond",Georgia,serif;letter-spacing:normal;text-transform:none;font-style:italic}
.modal .macts{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:90;
  background:var(--pergamino);color:var(--hueso);border:1px solid var(--oro-hondo);
  padding:11px 18px;border-radius:3px;font-size:16px;max-width:88vw;
  box-shadow:0 10px 34px var(--sombra);
  animation:subir .22s ease both;
}

/* ===== la tirada del presagio ===== */
.tirada{
  position:fixed;inset:0;z-index:85;background:rgba(6,4,3,.82);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  animation:aparecer .18s ease both;
}
.tirada .d20{width:176px;height:176px;filter:drop-shadow(0 0 22px rgba(212,168,60,.4))}
.tirada .d20{fill:var(--pergamino-2);stroke:var(--oro)}
.d20ico{fill:none;stroke:currentColor}
.tirada .d20 .cifra{fill:var(--oro);stroke:none;font-family:"Cinzel",serif;font-weight:700;font-size:30px;text-anchor:middle}
.tirada.girando .d20{animation:rodar .9s cubic-bezier(.3,.05,.2,1) both}
@keyframes rodar{
  0%{transform:rotate(0) scale(.6);opacity:.2}
  55%{transform:rotate(340deg) scale(1.12)}
  100%{transform:rotate(360deg) scale(1);opacity:1}
}
.tirada .veredicto{text-align:center;max-width:32ch}
.tirada .veredicto .n{font-family:"Cinzel",serif;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--oro)}
.tirada .veredicto .d{font-size:17px;color:var(--hueso-soft);margin-top:5px;font-style:italic}
.tirada.nat20 .d20{filter:drop-shadow(0 0 30px rgba(208,81,47,.75))}
.tirada.nat20 .d20 .cifra{fill:var(--brasa)}
.tirada.nat1 .d20{filter:drop-shadow(0 0 20px rgba(120,120,140,.4));opacity:.8}

@media (max-width:780px){
  .lineafila{grid-template-columns:1fr 1fr;gap:9px}
  .lineafila .l-texto{grid-column:1 / -1}
}
@media (max-width:580px){
  body{font-size:16.5px}
  .entry,.bit{grid-template-columns:1fr;gap:12px;padding-inline:15px}
  .cuando{flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap}

function clasificar(texto){
  var t = (texto||"").toLowerCase();
  var mejor = null, best = 0;
  for(var i=0;i<PISTAS.length;i++){
    var P = PISTAS[i], p = 0, j;
    for(j=0;j<P.v.length;j++) if(t.indexOf(P.v[j])>=0) p += 12;
    for(j=0;j<P.n.length;j++) if(t.indexOf(P.n[j])>=0) p += 4;
    if(p>best){ best = p; mejor = P.tipo; }
  }
  return mejor || "deuda";
}

function actor(id){
  if(!id) return null;
  var i;
  for(i=0;i<S.facciones.length;i++) if(S.facciones[i].id===id) return S.facciones[i];
  for(i=0;i<S.npcs.length;i++) if(S.npcs[i].id===id) return S.npcs[i];
  return null;
}
function esNpc(a){ return !!(a && a.id && a.id.charAt(0)==="n"); }
function perfil(a){
  /* un NPC hereda alcance y temple de su facción si no tiene propios */
  if(!a) return {alcance:"local", temple:"calculador", nombre:"alguien"};
  var f = esNpc(a) && a.faccionId ? actor(a.faccionId) : null;
  return {
    alcance: a.alcance || (f && f.alcance) || "local",
    temple:  a.temple  || (f && f.temple)  || "calculador",
    nombre:  a.nombre
  };
}
function hilo(id){ for(var i=0;i<S.hilos.length;i++) if(S.hilos[i].id===id) return S.hilos[i]; return null; }

/* =========================================================================
   GENERACIÓN
   La tirada de presagio es el d20 del mundo, y no es adorno: entra en la
   cuenta del vencimiento y puede subir o bajar la presión de lo que viene.
   ========================================================================= */

var PRESAGIOS = [
  {min:20, n:"El dragón abre un ojo", d:"Todo llega antes de lo que el grupo esperaba."},
  {min:16, n:"El mundo se adelanta",  d:"Las cuentas se acortan solas."},
  {min:9,  n:"El mundo sigue su paso",d:"Nadie apura ni afloja nada."},
  {min:4,  n:"Otros asuntos primero", d:"Lo del grupo baja en la lista de prioridades."},
  {min:1,  n:"El mundo se distrae",   d:"Esta vez respiran. Esta vez."}
];
function leerPresagio(t){
  for(var i=0;i<PRESAGIOS.length;i++) if(t >= PRESAGIOS[i].min) return PRESAGIOS[i];
  return PRESAGIOS[PRESAGIOS.length-1];
}
function tirarD20(){ return 1 + Math.floor(Math.random()*20); }

function venceEn(h, p, presagio){
  var base = (ALCANCES[p.alcance]||ALCANCES.local).base;
  var mult = (TEMPLES[p.temple]||TEMPLES.calculador).mult;
  var grav = 1.25 - 0.12 * (h.gravedad||3);          /* más grave, más rápido */
  var esc  = Math.pow(0.85, h.vueltas||0);            /* cada vuelta acorta la mecha */
  var jit  = 0.82 + Math.random()*0.36;
  var aug  = 1.25 - (presagio/20) * 0.5;              /* 20 adelanta, 1 demora */
  var d = Math.round(base * mult * grav * esc * jit * aug);
  return Math.max(2, d);
}

function rellenar(txt, h, a){
  var p = perfil(a);
  var quien = esNpc(a) ? p.nombre : "alguien de " + p.nombre;
  return txt
    .replace(/\{A\}/g, p.nombre)
    .replace(/\{alguien\}/g, quien)
    .replace(/\{lugar\}/g, S.campana.lugar || "la ciudad");
}

function proponer(h, presagio){
  if(presagio == null) presagio = tirarD20();
  var a = actor(h.actorId);
  var p = perfil(a);
  var objetivo = Math.min(3, 1 + (h.vueltas||0));
  var evitadas = h.evitadas || [];
  var usadasEnCampana = {};
  for(var i=0;i<S.consecuencias.length;i++) usadasEnCampana[S.consecuencias[i].formaId] = true;

  var pool = [];
  for(var k=0;k<FORMAS.length;k++){
    var f = FORMAS[k];
    if(f.tipos.indexOf(h.tipo)<0) continue;
    if(evitadas.indexOf(f.id)>=0) continue;
    var s = 10 - Math.abs(f.presion - objetivo)*4;
    if(f.temples && f.temples.indexOf(p.temple)>=0) s += 5;
    if(usadasEnCampana[f.id]) s -= 7;
    pool.push({f:f, s:s + Math.random()*3.5});
  }
  if(!pool.length) return null;
  pool.sort(function(x,y){ return y.s - x.s; });
  var forma = pool[0].f;

  var presion = Math.min(3, Math.max(forma.presion, objetivo));
  if(presagio >= 18) presion = Math.min(3, presion + 1);
  if(presagio <= 3)  presion = Math.max(1, presion - 1);

  return {
    id: uid("c"),
    hiloId: h.id,
    formaId: forma.id,
    titulo: forma.t,
    cuerpo: rellenar(forma.c, h, a),
    tono: (TEMPLES[p.temple]||TEMPLES.calculador).tono,
    ignorar: rellenar(forma.i, h, a),
    presion: presion,
    presagio: presagio,
    diaVence: S.campana.dia + venceEn(h, p, presagio),
    creadaDia: S.campana.dia,
    sesionN: S.sesiones.length,
    estado: "propuesta"
  };
}

function hilosQueAprietan(){
  /* un hilo pide consecuencia si está abierto y no tiene ninguna pendiente */
  var pendientePorHilo = {};
  for(var i=0;i<S.consecuencias.length;i++){
    var c = S.consecuencias[i];
    if(c.estado==="pendiente") pendientePorHilo[c.hiloId] = true;
  }
  var out = [];
  for(var j=0;j<S.hilos.length;j++){
    var h = S.hilos[j];
    if(h.estado!=="abierto") continue;
    if(pendientePorHilo[h.id]) continue;
    if(!actor(h.actorId)) continue;
    out.push(h);
  }
  out.sort(function(a,b){
    var pa = (a.gravedad||3)*3 + (S.campana.dia - a.diaOrigen)/10 + (a.vueltas||0);
    var pb = (b.gravedad||3)*3 + (S.campana.dia - b.diaOrigen)/10 + (b.vueltas||0);
    return pb - pa;
  });
  return out;
}

function generar(limite, presagio){
  if(presagio == null) presagio = tirarD20();
  var hs = hilosQueAprietan();
  var max = limite || 4;
  propuestas = [];
  for(var i=0;i<hs.length && propuestas.length<max;i++){
    var c = proponer(hs[i], presagio);
    if(c) propuestas.push(c);
  }
  ultimoPresagio = presagio;
  return propuestas;
}

function esc(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function sec(txt){
  return '<div class="seccion"><span class="rotulo">' + esc(txt) + '</span><span class="hilo-oro"></span></div>';
}

function estadoVenc(c){
  var d = c.diaVence - S.campana.dia;
  if(d < 0) return {k:"vencida", txt:"vencida", det:"hace " + (-d) + (-d===1?" día":" días")};
  if(d === 0) return {k:"vencida", txt:"vence hoy", det:"hoy"};
  if(d <= 7) return {k:"inminente", txt:"inminente", det:"en " + d + (d===1?" día":" días")};
  if(d <= 30) return {k:"camino", txt:"en camino", det:"en " + d + " días"};
  return {k:"lejana", txt:"lejos", det:"en " + d + " días"};
}

function llamas(n){
  var s = '<span class="llamas">';

    s += '<svg viewBox="0 0 12 14" class="' + (i<=n ? "" : "off") + '" style="color:' +
         (i<=n ? "var(--ambar)" : "var(--ceniza)") + '"><use href="#llama"/></svg>';
  }
  return s + "</span>";
}

function d20HTML(n){
  return '<span class="presagio" title="Tirada de presagio con la que se calculó esta fecha">' +
         '<svg class="d20ico" viewBox="0 0 100 100"><use href="#d20"/></svg>' + n + "</span>";
}

/* la mecha: cuánto del plazo ya se quemó */
function mechaHTML(c){
  var total = Math.max(1, c.diaVence - (c.creadaDia==null ? c.diaVence-1 : c.creadaDia));
  var pasado = S.campana.dia - (c.creadaDia==null ? c.diaVence-1 : c.creadaDia);
  var pct = Math.max(0, Math.min(100, Math.round(pasado / total * 100)));
  var arde = pct >= 72;
  return '<div class="mecha' + (arde ? " arde" : "") + '" role="img" aria-label="Plazo consumido: ' + pct + ' por ciento">' +
         '<i style="width:' + pct + '%"></i>' +
         '<svg viewBox="0 0 12 14" style="left:' + Math.max(3, Math.min(97, pct)) + '%;color:' + (arde ? "var(--brasa)" : "var(--ambar)") + '"><use href="#llama"/></svg>' +
         "</div>";
}

function pendientes(){
  var out = [];
  for(var i=0;i<S.consecuencias.length;i++) if(S.consecuencias[i].estado==="pendiente") out.push(S.consecuencias[i]);
  out.sort(function(a,b){ return a.diaVence - b.diaVence; });
  return out;
}
function vencidasCount(){
  var p = pendientes(), n = 0;
  for(var i=0;i<p.length;i++) if(p[i].diaVence <= S.campana.dia) n++;
  return n;
}

function animoHTML(v){
  v = typeof v === "number" ? v : 0;
  var pct = Math.max(8, Math.round(((v + 3) / 6) * 100));
  var col = v < -1 ? "var(--brasa)" : (v > 1 ? "var(--jade)" : "var(--ceniza)");
  var etiqueta = v <= -2 ? "hostil" : v === -1 ? "recelo" : v === 0 ? "indiferente" : v === 1 ? "cordial" : "leal";
  return '<div class="animo"><div class="animobar"><span style="width:' + pct + '%;background:' + col + '"></span></div>' +
         '<span class="rotulo">' + etiqueta + "</span></div>";
}

/* ---------- la tirada de presagio ---------- */
function mostrarTirada(n){
  return new Promise(function(resolve){
    var root = document.getElementById("tirada-root");
    var p = leerPresagio(n);
    var quieto = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var extra = n === 20 ? " nat20" : (n === 1 ? " nat1" : "");

    root.innerHTML =
      '<div class="tirada' + (quieto ? "" : " girando") + extra + '" role="status">' +
        '<svg class="d20" viewBox="0 0 100 100" aria-hidden="true"><use href="#d20"/>' +
          '<text class="cifra" x="50" y="63">' + n + "</text></svg>" +
        '<div class="veredicto"><div class="n">' + esc(p.n) + "</div>" +
          '<div class="d">' + esc(p.d) + "</div></div>" +
      "</div>";

    var overlay = root.firstChild;
    var cerrado = false;
    function cerrar(){
      if(cerrado) return;
      cerrado = true;
      root.innerHTML = "";
      document.removeEventListener("keydown", onKey);
      resolve(n);
    }
    function onKey(){ cerrar(); }
    document.addEventListener("keydown", onKey);
    overlay.addEventListener("click", cerrar);
    setTimeout(cerrar, quieto ? 900 : 1750);
  });
}

/* Tira el d20 del mundo y propone consecuencias con ese resultado. */
function convocar(){
  var n = tirarD20();
  return mostrarTirada(n).then(function(){
    generar(4, n);
    irA("tablero");
    if(!propuestas.length) toast("No hay hilos abiertos esperando turno.");
    else toast(propuestas.length + " propuesta(s) con presagio " + n + ". Anotá las que sirvan.");
  });
}
/* Diálogos propios: los del navegador pueden estar bloqueados dentro del visor. */
function modal(spec){
  return new Promise(function(resolve){
    var root = document.getElementById("modal-root");
    var campos = spec.campos || [];
    var h = '<div class="overlay"><form class="modal" novalidate>';
    h += "<h3>" + esc(spec.titulo) + "</h3>";
    if(spec.texto) h += '<p class="mtxt">' + esc(spec.texto) + "</p>";
    if(campos.length){
      h += '<div class="mcampos">';
      for(var i=0;i<campos.length;i++){
        var c = campos[i];
        h += '<label class="campo"><span>' + esc(c.label) + "</span>";
        if(c.tipo === "select"){
          h += '<select data-k="' + esc(c.k) + '">';
          for(var j=0;j<c.opciones.length;j++){
            var o = c.opciones[j];
            h += '<option value="' + esc(o.v) + '"' + (String(o.v)===String(c.valor) ? " selected" : "") + ">" +
                 esc(o.n) + "</option>";
          }
          h += "</select>";
          if(c.opciones.some(function(o){ return o.g; })){
            h += '<span class="mopt" data-help="' + esc(c.k) + '"></span>';
          }
        } else if(c.tipo === "textarea"){
          h += '<textarea data-k="' + esc(c.k) + '" rows="3"></textarea>';
        } else {
          h += '<input type="' + (c.tipo==="number" ? "number" : "text") + '" data-k="' + esc(c.k) + '"' +
               (c.tipo==="number" ? ' min="' + (c.min!=null?c.min:0) + '"' : "") +
               ' value="' + esc(c.valor==null ? "" : c.valor) + '">';
        }
        if(c.hint) h += '<span class="mopt">' + esc(c.hint) + "</span>";
        h += "</label>";
      }
      h += "</div>";
    }
    h += '<div class="macts">';
    h += '<button type="button" class="btn fantasma" data-m="no">' + esc(spec.cancelar || "Cancelar") + "</button>";
    h += '<button type="submit" class="btn ' + (spec.peligro ? "peligro" : "oro") + '">' + esc(spec.ok || "Guardar") + "</button>";
    h += "</div></form></div>";
    root.innerHTML = h;

    var overlay = root.querySelector(".overlay");
    var form = root.querySelector("form");

    /* textareas y ayudas de select no se pueden poblar por atributo */
    for(var t=0;t<campos.length;t++){
      var cc = campos[t];
      if(cc.tipo === "textarea"){
        var ta = form.querySelector('[data-k="' + cc.k + '"]');
        if(ta) ta.value = cc.valor == null ? "" : cc.valor;
      }
      if(cc.tipo === "select") pintarAyuda(cc);
    }
    function pintarAyuda(c){
      var sel = form.querySelector('select[data-k="' + c.k + '"]');
      var help = form.querySelector('[data-help="' + c.k + '"]');
      if(!sel || !help) return;
      var refrescar = function(){
        var o = null;
        for(var q=0;q<c.opciones.length;q++) if(String(c.opciones[q].v) === sel.value) o = c.opciones[q];
        help.textContent = o && o.g ? o.g : "";
      };
      sel.addEventListener("change", refrescar);
      refrescar();
    }

    function cerrar(valor){
      document.removeEventListener("keydown", onKey);
      root.innerHTML = "";
      resolve(valor);
    }
    function onKey(e){ if(e.key === "Escape") cerrar(null); }
    document.addEventListener("keydown", onKey);

    overlay.addEventListener("mousedown", function(e){ if(e.target === overlay) cerrar(null); });
    form.querySelector('[data-m="no"]').addEventListener("click", function(){ cerrar(null); });
    form.addEventListener("submit", function(e){
      e.preventDefault();
      var out = {};
      var ctrls = form.querySelectorAll("[data-k]");
      for(var i=0;i<ctrls.length;i++){
        var el = ctrls[i];
        var k = el.getAttribute("data-k");
        out[k] = el.type === "number" ? (el.value === "" ? null : Number(el.value)) : el.value.trim();
      }
      cerrar(out);
    });

    var first = form.querySelector("input,select,textarea") || form.querySelector('button[type="submit"]');
    if(first) first.focus();
    if(first && first.select) try{ first.select(); }catch(e){}
  });
}

function confirmar(titulo, texto, ok){
  return modal({titulo:titulo, texto:texto, ok:ok || "Sí, dale", cancelar:"No", peligro:true, campos:[]})
    .then(function(r){ return r !== null; });
}

function opcionesDe(mapa){
  var out = [];
  for(var k in mapa) out.push({v:k, n:mapa[k].n, g:mapa[k].g});
  return out;
}

function toast(msg){
  var old = document.querySelector(".toast");
  if(old) old.remove();
  var d = document.createElement("div");
  d.className = "toast";
  d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(function(){ if(d.parentNode) d.remove(); }, 3200);
}
/* =========================================================================
   ACCIONES
   ========================================================================= */

function irA(tab){ tabActual = tab; render(); window.scrollTo({top:0,behavior:"smooth"}); }

function leerBitacora(){
  var txt = (document.getElementById("in-log")||{}).value || "";
  var dias = parseInt((document.getElementById("in-dias")||{}).value, 10);
  var titulo = ((document.getElementById("in-titulo")||{}).value || "").trim();
  var brutas = txt.split("\n").map(function(s){ return s.trim(); }).filter(function(s){ return s.length > 3; });
  if(!brutas.length){ toast("Escribí al menos una línea de lo que hicieron."); return; }

  lineasLeidas = brutas.map(function(t){
    return {
      texto: t,
      tipo: clasificar(t),
      actorId: adivinarActor(t),
      gravedad: adivinarGravedad(t)
    };
  });
  lineasLeidas.dias = isNaN(dias) ? 7 : Math.max(0, dias);
  lineasLeidas.titulo = titulo;
  render();
}

function adivinarActor(texto){
  var t = texto.toLowerCase();
  var todos = S.facciones.concat(S.npcs);
  var mejor = "", largo = 0;
  for(var i=0;i<todos.length;i++){
    var partes = todos[i].nombre.toLowerCase().split(/\s+/);
    for(var j=0;j<partes.length;j++){
      var p = partes[j].replace(/[^a-záéíóúñü]/gi,"");
      if(p.length < 4) continue;
      if(t.indexOf(p) >= 0 && p.length > largo){ largo = p.length; mejor = todos[i].id; }
    }
  }
  return mejor;
}
function adivinarGravedad(texto){
  var t = texto.toLowerCase();
  if(/mat|asesin|degoll|masacr|quem|incendi|destruy|reliquia|traicion|traición/.test(t)) return 4;
  if(/rob|hirier|amenaz|romp/.test(t)) return 3;
  return 2;
}

function cerrarSesion(){
  var filas = document.querySelectorAll(".lineafila");
  var nuevos = [], lineas = [];
  for(var i=0;i<filas.length;i++){
    var f = filas[i];
    var texto = f.querySelector('[data-f="texto"]').value.trim();
    if(!texto) continue;
    lineas.push(texto);
    var tipo = f.querySelector('[data-f="tipo"]').value;
    var actorId = f.querySelector('[data-f="actorId"]').value;
    var grav = parseInt(f.querySelector('[data-f="gravedad"]').value, 10) || 3;
    if(!actorId) continue;
    nuevos.push({tipo:tipo, actorId:actorId, gravedad:grav, titulo:texto});
  }
  if(!lineas.length){ toast("No quedó ninguna línea."); return; }

  var dias = lineasLeidas.dias || 0;
  S.campana.dia += dias;
  var n = S.sesiones.length + 1;
  S.sesiones.push({
    id: uid("s"), n: n, dia: S.campana.dia, duracion: dias,
    titulo: lineasLeidas.titulo || "", lineas: lineas
  });

  for(var k=0;k<nuevos.length;k++){
    var x = nuevos[k];
    S.hilos.push({
      id: uid("h"), titulo: x.titulo, tipo: x.tipo, actorId: x.actorId,
      gravedad: x.gravedad, diaOrigen: S.campana.dia, sesionN: n,
      estado: "abierto", vueltas: 0, evitadas: []
    });
    var a = actor(x.actorId);
    if(a){
      var delta = TIPOS[x.tipo] && TIPOS[x.tipo].bueno ? 1 : -1;
      a.animo = Math.max(-3, Math.min(3, (a.animo||0) + delta));
    }
  }

  S.ejemplo = false;
  lineasLeidas = null;
  guardar();
  irA("tablero");
  var n = tirarD20();
  mostrarTirada(n).then(function(){
    generar(4, n);
    render();
    toast(nuevos.length + " hilo(s) nuevo(s) · " + propuestas.length + " consecuencia(s) propuesta(s).");
  });
}

function anotar(id){
  for(var i=0;i<propuestas.length;i++){
    if(propuestas[i].id===id){
      var c = propuestas[i];
      c.estado = "pendiente";
      S.consecuencias.push(c);
      propuestas.splice(i,1);
      guardar(); render();
      return;
    }
  }
}
function tirarPropuesta(id){
  for(var i=0;i<propuestas.length;i++){
    if(propuestas[i].id===id){
      var h = hilo(propuestas[i].hiloId);
      if(h){ h.evitadas = h.evitadas || []; h.evitadas.push(propuestas[i].formaId); }
      propuestas.splice(i,1);
      guardar(); render();
      return;
    }
  }
}
function rerollPropuesta(id){
  for(var i=0;i<propuestas.length;i++){
    if(propuestas[i].id===id){
      var h = hilo(propuestas[i].hiloId);
      if(!h) return;
      h.evitadas = h.evitadas || [];
      h.evitadas.push(propuestas[i].formaId);
      var nueva = proponer(h);
      if(nueva) propuestas[i] = nueva; else propuestas.splice(i,1);
      guardar(); render();
      return;
    }
  }
}

function consecuencia(id){
  for(var i=0;i<S.consecuencias.length;i++) if(S.consecuencias[i].id===id) return S.consecuencias[i];
  return null;
}

function usarConsecuencia(id){
  var c = consecuencia(id); if(!c) return;
  c.estado = "usada";
  var h = hilo(c.hiloId);
  if(h){
    h.vueltas = (h.vueltas||0) + 1;
    if(h.vueltas >= 3 && h.gravedad < 5) h.gravedad++;
  }
  guardar(); render();
  toast("Anotada como usada. El hilo vuelve más fuerte la próxima.");
}
function descartarConsecuencia(id){
  var c = consecuencia(id); if(!c) return;
  var h = hilo(c.hiloId);
  if(h){ h.evitadas = h.evitadas || []; h.evitadas.push(c.formaId); }
  S.consecuencias = S.consecuencias.filter(function(x){ return x.id !== id; });
  guardar(); render();
  toast("Descartada. El hilo sigue abierto y va a volver con otra forma.");
}
function posponerConsecuencia(id){
  var c = consecuencia(id); if(!c) return;
  modal({
    titulo:"Posponer",
    texto:"Vence el día " + c.diaVence + ". Hoy es el día " + S.campana.dia + ".",
    ok:"Correr la fecha",
    campos:[{k:"dias", label:"Cuántos días de juego la corro", tipo:"number", valor:14, min:-365}]
  }).then(function(r){
    if(!r || r.dias == null) return;
    c.diaVence = Math.max(S.campana.dia, c.diaVence + r.dias);
    guardar(); render();
  });
}
function otraForma(id){
  var c = consecuencia(id); if(!c) return;
  var h = hilo(c.hiloId); if(!h) return;
  h.evitadas = h.evitadas || [];
  h.evitadas.push(c.formaId);
  var nueva = proponer(h);
  if(!nueva){ toast("No me quedan más formas para este hilo."); return; }
  nueva.estado = "pendiente";
  nueva.diaVence = c.diaVence;
  S.consecuencias = S.consecuencias.filter(function(x){ return x.id !== id; });
  S.consecuencias.push(nueva);
  guardar(); render();
}

/* ---------- afinar con IA (opcional) ---------- */
function afinar(id){
  var c = consecuencia(id); if(!c || !sample) return;
  var h = hilo(c.hiloId);
  var a = h ? actor(h.actorId) : null;
  var p = perfil(a);
  var btn = document.querySelector('[data-act="afinar"][data-c="'+id+'"]');
  if(btn){ btn.disabled = true; btn.textContent = "Afinando…"; }

  var ultimas = [];
  for(var i=Math.max(0,S.sesiones.length-3); i<S.sesiones.length; i++)
    ultimas = ultimas.concat(S.sesiones[i].lineas);

  var pedido = [
    "Sos asistente de un DM. Reescribí una consecuencia de campaña para que use los nombres propios de esta mesa.",
    "",
    "Campaña: " + (S.campana.nombre||"sin nombre") + ". Lugar principal: " + (S.campana.lugar||"la ciudad") + ".",
    "Actor: " + (a?a.nombre:"desconocido") + " (" + (TEMPLES[p.temple]||{}).n + ", alcance " + p.alcance + ").",
    "Causa abierta: " + (h?h.titulo:"") + " (" + (h?(TIPOS[h.tipo]||{}).n:"") + ").",
    "Vence el día " + c.diaVence + " y hoy es el día " + S.campana.dia + ".",
    "Lo que hicieron los jugadores últimamente:",
    ultimas.map(function(l){ return "- " + l; }).join("\n"),
    "",
    "Texto genérico a reescribir:",
    c.titulo + ": " + c.cuerpo,
    "",
    "Reglas: dos oraciones como máximo, en español rioplatense neutro, en presente.",
    "Nombrá al actor y a la causa concreta. Describí SOLO la presión que llega y su forma;",
    "NO resuelvas nada, no inventes nombres nuevos, no digas cómo reaccionan los jugadores,",
    "no agregues diálogo ni tiradas. Devolvé solo el texto, sin comillas ni título."
  ].join("\n");

  sample(pedido, {modelTier:"quick"}).then(function(r){
    var txt = (r && r.text ? r.text : "").trim();
    if(txt){
      c.cuerpoOriginal = c.cuerpoOriginal || c.cuerpo;
      c.cuerpo = txt;
      c.afinada = true;
      guardar();
    }
    render();
  }).catch(function(e){
    render();
    var code = e && e.code;
    if(code === "not_granted") toast("Para afinar hace falta permitir que la página le pregunte a Claude.");
    else if(code === "rate_limited") toast("Demasiados pedidos seguidos. Probá en un rato.");
    else toast("No se pudo afinar el texto. El original sigue intacto.");
  });
}

    {v:"-3", n:"Hostil"}, {v:"-2", n:"Con bronca"}, {v:"-1", n:"Recelosa"},

  ];

  if(esF){
    campos = [
      {k:"nombre", label:"Nombre de la facción", valor:a?a.nombre:"", hint:"Casa Renaldi, Guardia del Puerto, el Culto…"},
      {k:"temple", label:"Temperamento", tipo:"select", opciones:opcionesDe(TEMPLES), valor:a?a.temple:"calculador"},
      {k:"alcance", label:"Alcance", tipo:"select", opciones:opcionesDe(ALCANCES), valor:a?a.alcance:"local"},
      {k:"animo", label:"Cómo ven al grupo", tipo:"select", opciones:animos, valor:String(a?(a.animo||0):0)},
      {k:"notas", label:"Una línea de contexto (opcional)", tipo:"textarea", valor:a?(a.notas||""):""}
    ];
  } else {
    var fops = [{v:"", n:"— ninguna —"}];
    for(var i=0;i<S.facciones.length;i++) fops.push({v:S.facciones[i].id, n:S.facciones[i].nombre});
    campos = [
      {k:"nombre", label:"Nombre del NPC", valor:a?a.nombre:""},
      {k:"rol", label:"Qué es o qué hace", valor:a?(a.rol||""):"", hint:"Prestamista, informante del muelle, capitán…"},
      {k:"faccionId", label:"Facción a la que responde", tipo:"select", opciones:fops, valor:a?(a.faccionId||""):""},
      {k:"estado", label:"Estado", tipo:"select", valor:a?(a.estado||"vivo"):"vivo",
       opciones:[{v:"vivo",n:"Vivo"},{v:"muerto",n:"Muerto"},{v:"desaparecido",n:"Desaparecido"},{v:"hostil",n:"Hostil"}]},
      {k:"animo", label:"Cómo ve al grupo", tipo:"select", opciones:animos, valor:String(a?(a.animo||0):0)},
      {k:"notas", label:"Una línea de contexto (opcional)", tipo:"textarea", valor:a?(a.notas||""):""}
    ];
  }

  modal({
    titulo: a ? "Editar " + a.nombre : (esF ? "Nueva facción" : "Nuevo NPC"),
    texto: esF ? "El temperamento decide cómo vuelve; el alcance, cuánto tarda." : "Si no tiene facción propia, hereda el temperamento de la suya.",
    ok: a ? "Guardar cambios" : "Agregar",
    campos: campos
  }).then(function(r){
    if(!r || !r.nombre) return;
    var animo = parseInt(r.animo, 10) || 0;
    if(esF){
      if(a){ a.nombre=r.nombre; a.temple=r.temple; a.alcance=r.alcance; a.animo=animo; a.notas=r.notas; }
      else S.facciones.push({id:uid("f"), nombre:r.nombre, temple:r.temple, alcance:r.alcance, animo:animo, notas:r.notas});
    } else {
      if(a){ a.nombre=r.nombre; a.rol=r.rol; a.faccionId=r.faccionId; a.estado=r.estado; a.animo=animo; a.notas=r.notas; }
      else S.npcs.push({id:uid("n"), nombre:r.nombre, rol:r.rol, faccionId:r.faccionId, estado:r.estado, animo:animo, notas:r.notas});
    }
    S.ejemplo = false;
    guardar(); render();
  });
}

function borrarActor(id){
  var a = actor(id); if(!a) return;
  var hilosDe = S.hilos.filter(function(h){ return h.actorId===id; }).length;
  confirmar("¿Borrar a " + a.nombre + "?",
    hilosDe ? "Tiene " + hilosDe + " hilo(s) abiertos que van a quedar sin actor." : "No tiene hilos asociados.",
    "Borrar"
  ).then(function(ok){
    if(!ok) return;
    S.facciones = S.facciones.filter(function(x){ return x.id!==id; });
    S.npcs = S.npcs.filter(function(x){ return x.id!==id; });
    guardar(); render();
  });
}

/* ---------- hilos ---------- */
function actoresOpciones(){
  var out = [];
  var todos = S.facciones.concat(S.npcs);
  for(var i=0;i<todos.length;i++) out.push({v:todos[i].id, n:todos[i].nombre});
  return out;
}
var GRAVEDADES = [
  {v:"1", n:"1 — una molestia"},
  {v:"2", n:"2 — les va a costar"},
  {v:"3", n:"3 — se acuerdan"},
  {v:"4", n:"4 — no lo perdonan"},
  {v:"5", n:"5 — es personal para siempre"}
];

function editorHilo(existente){
  var t = existente || null;
  if(!S.facciones.length && !S.npcs.length){ toast("Primero cargá al menos una facción o un NPC."); return; }
  modal({
    titulo: t ? "Editar hilo" : "Hilo nuevo",
    texto: t ? "" : "Una causa sin saldar que el mundo todavía tiene anotada.",
    ok: t ? "Guardar" : "Abrir el hilo",
    campos:[
      {k:"titulo", label:"Qué pasó, en una línea", valor:t?t.titulo:"",
       hint:"Mataron al capitán de la guardia en la taberna."},
      {k:"tipo", label:"Tipo de hilo", tipo:"select", opciones:opcionesDe(TIPOS), valor:t?t.tipo:"deuda"},
      {k:"actorId", label:"Con quién", tipo:"select", opciones:actoresOpciones(), valor:t?t.actorId:""},
      {k:"gravedad", label:"Gravedad", tipo:"select", opciones:GRAVEDADES, valor:String(t?(t.gravedad||3):3)}
    ]
  }).then(function(r){
    if(!r || !r.titulo) return;
    var g = Math.max(1, Math.min(5, parseInt(r.gravedad,10) || 3));
    if(t){
      t.titulo = r.titulo; t.tipo = r.tipo; t.actorId = r.actorId; t.gravedad = g;
    } else {
      S.hilos.push({
        id: uid("h"), titulo: r.titulo, tipo: r.tipo, actorId: r.actorId,
        gravedad: g, diaOrigen: S.campana.dia, sesionN: S.sesiones.length,
        estado: "abierto", vueltas: 0, evitadas: []
      });
    }
    S.ejemplo = false;
    guardar(); render();
  });
}

function forzarHilo(id){
  var t = hilo(id); if(!t) return;
  var c = proponer(t);
  if(!c){ toast("No me quedan formas nuevas para este hilo."); return; }
  propuestas = propuestas.filter(function(p){ return p.hiloId !== id; });
  propuestas.push(c);
  irA("tablero");
}

/* ---------- respaldo ---------- */
function exportarJSON(){
  var txt = JSON.stringify(S, null, 2);
  var nombre = (S.campana.nombre||"campana").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "campana";
  guardarArchivo(nombre + "-sesion" + S.sesiones.length + ".json", txt, function(){
    S.ultimoRespaldo = {sesion: S.sesiones.length, cuando: Date.now()};
    guardar(); render();
  });
}

function notasMarkdown(){
  var ps = pendientes();
  var L = [];
  L.push("# " + (S.campana.nombre||"Campaña") + " — notas para la próxima sesión");
  L.push("");
  L.push("Día de campaña: " + S.campana.dia + " · sesiones jugadas: " + S.sesiones.length);
  L.push("");
  L.push("## Lo que vuelve");
  if(!ps.length) L.push("_Nada pendiente._");
  for(var i=0;i<ps.length;i++){
    var c = ps[i];
    var h = hilo(c.hiloId);
    var a = h ? actor(h.actorId) : null;
    var st = estadoVenc(c);
    L.push("");
    L.push("### Día " + c.diaVence + " — " + c.titulo + " (" + st.txt + ", " + st.det + ")");
    L.push("- **Quién:** " + (a ? a.nombre : "—"));
    if(h) L.push("- **Por qué:** " + h.titulo);
    L.push("- " + c.cuerpo);
    L.push("- _" + c.tono + "_");
    if(c.ignorar) L.push("- **Si lo dejan pasar:** " + c.ignorar);
  }
  L.push("");
  L.push("## Hilos abiertos");
  var ab = S.hilos.filter(function(x){return x.estado==="abierto";});
  for(var j=0;j<ab.length;j++){
    var t = ab[j], ac = actor(t.actorId);
    L.push("- [" + (TIPOS[t.tipo]||{n:t.tipo}).n + "] " + t.titulo + " — " + (ac?ac.nombre:"—") +
           " (gravedad " + (t.gravedad||3) + ", " + (t.vueltas||0) + " vueltas)");
  }
  var nombre = (S.campana.nombre||"campana").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "campana";
  guardarArchivo(nombre + "-notas.md", L.join("\n"), null);
}

function guardarArchivo(filename, texto, onOk){
  if(downloads){
    downloads.save({filename: filename, data: texto}).then(function(){
      toast("Archivo guardado.");
      if(onOk) onOk();
    }).catch(function(e){
      if(e && e.code === "declined") return;
      mostrarTexto(filename, texto);
    });
  } else {
    mostrarTexto(filename, texto);
  }
}

function mostrarTexto(filename, texto){
  tabActual = "datos";
  render();
  var out = document.getElementById("json-out");
  if(!out) return;
  out.innerHTML = sec(filename) +
    '<p class="ayuda" style="margin-block:8px 10px">Copiá esto y guardalo en un archivo.</p>' +
    '<textarea rows="10" id="out-area"></textarea>';
  var ta = document.getElementById("out-area");
  ta.value = texto;
  ta.focus();
  ta.select();
  out.scrollIntoView({behavior:"smooth", block:"start"});
}

function importarJSON(){
  var el = document.getElementById("in-import");
  var raw = el ? el.value.trim() : "";
  if(!raw){ toast("Pegá el contenido del respaldo."); return; }
  var d;
  try{ d = JSON.parse(raw); }
  catch(e){ toast("Ese texto no es un respaldo válido."); return; }
  if(!d || d.v !== 1 || !d.campana){ toast("Ese respaldo no tiene el formato esperado."); return; }
  confirmar("Cargar " + (d.campana.nombre || "esa campaña"),
    "Reemplaza todo lo que tenés cargado ahora. Si no bajaste respaldo, esto se pierde.",
    "Reemplazar").then(function(ok){
      if(!ok) return;
      S = normalizar(d);
      propuestas = [];
      guardar();
      irA("tablero");
      toast("Campaña cargada: " + (S.campana.nombre||"sin nombre"));
    });
}

function resetear(){
  modal({
    titulo:"Campaña nueva",
    texto:"Borra facciones, NPCs, hilos, sesiones y consecuencias. No se puede deshacer.",
    ok:"Vaciar y empezar", peligro:true,
    campos:[
      {k:"nombre", label:"Nombre de la campaña", valor:"", hint:"El que usen en la mesa."},
      {k:"lugar", label:"Plaza principal", valor:"", hint:"La ciudad o región donde arranca todo."}
    ]
  }).then(function(r){
    if(!r) return;
    S = {
      v:1, ejemplo:false,
      campana:{nombre:r.nombre || "Campaña nueva", lugar:r.lugar || "la ciudad", dia:1},
      facciones:[], npcs:[], hilos:[], sesiones:[], consecuencias:[], ultimoRespaldo:null
    };
    propuestas = [];
    guardar();
    irA("mundo");
    toast("Campaña vacía. Empezá cargando las facciones.");
  });
}

function avanzarDias(){
  modal({
    titulo:"Avanzar el reloj",
    texto:"Hoy es el día " + S.campana.dia + " de campaña. Esto mueve el tiempo sin cargar una sesión.",
    ok:"Avanzar",
    campos:[{k:"dias", label:"Días de tiempo de juego", tipo:"number", valor:7, min:1}]
  }).then(function(r){
    if(!r || !r.dias || r.dias <= 0) return;
    S.campana.dia += r.dias;
    guardar(); render();
    var v = vencidasCount();
    toast("Día " + S.campana.dia + (v ? " · " + v + " consecuencia(s) ya vencida(s)" : ""));
  });
}

/* =========================================================================
   EVENTOS
   ========================================================================= */

document.getElementById("tabs").addEventListener("click", function(e){
  var b = e.target.closest("[data-tab]");
  if(b) irA(b.getAttribute("data-tab"));
});
document.getElementById("btn-advance").addEventListener("click", avanzarDias);

document.getElementById("view").addEventListener("click", function(e){
  var b = e.target.closest("button");
  if(!b) return;
  var act = b.getAttribute("data-act");
  var id = b.getAttribute("data-c") || b.getAttribute("data-p") || b.getAttribute("data-h") || b.getAttribute("data-id");

  if(b.id === "go-generar"){ convocar(); return; }
  if(b.id === "go-sesion"){ irA("sesion"); return; }
  if(b.id === "btn-leer"){ leerBitacora(); return; }
  if(b.id === "btn-cerrar-sesion"){ cerrarSesion(); return; }
  if(b.id === "btn-cancelar-lectura"){ lineasLeidas = null; render(); return; }

  switch(act){
    case "anotar": anotar(id); break;
    case "tirar": tirarPropuesta(id); break;
    case "reroll": rerollPropuesta(id); break;
    case "usar": usarConsecuencia(id); break;
    case "descartar": descartarConsecuencia(id); break;
    case "posponer": posponerConsecuencia(id); break;
    case "otra": otraForma(id); break;
    case "afinar": afinar(id); break;
    case "nueva-faccion": editorActor("faccion", null); break;
    case "nuevo-npc": editorActor("npc", null); break;
    case "editar-actor": {
      var a = actor(id);
      if(a) editorActor(esNpc(a) ? "npc" : "faccion", a);
      break;
    }
    case "borrar-actor": borrarActor(id); break;
    case "nuevo-hilo": editorHilo(null); break;
    case "editar-hilo": editorHilo(hilo(id)); break;
    case "borrar-hilo": {
      var ht = hilo(id);
      confirmar("¿Borrar este hilo?", ht ? ht.titulo : "", "Borrar").then(function(ok){
        if(!ok) return;
        S.hilos = S.hilos.filter(function(x){ return x.id!==id; });
        S.consecuencias = S.consecuencias.filter(function(x){ return x.hiloId!==id; });
        guardar(); render();
      });
      break;
    }
    case "saldar": { var t1 = hilo(id); if(t1){ t1.estado = "saldado"; guardar(); render(); } break; }
    case "reabrir": { var t2 = hilo(id); if(t2){ t2.estado = "abierto"; guardar(); render(); } break; }
    case "forzar": forzarHilo(id); break;
    case "exportar": exportarJSON(); break;
    case "notas": notasMarkdown(); break;
    case "mostrar-json": mostrarTexto("respaldo.json", JSON.stringify(S, null, 2)); break;
    case "importar": importarJSON(); break;
    case "reset": resetear(); break;
    case "guardar-campana": {
      var nm = document.getElementById("in-camp").value.trim();
      var lg = document.getElementById("in-lugar").value.trim();
      var dd = parseInt(document.getElementById("in-dia").value, 10);
      if(nm) S.campana.nombre = nm;
      S.campana.lugar = lg || "la ciudad";
      if(!isNaN(dd) && dd > 0) S.campana.dia = dd;
      S.ejemplo = false;
      guardar(); render();
      toast("Guardado.");
      break;
    }
  }
});

function normalizar(d){
  d.v = 1;
  d.campana = d.campana || {nombre:"Campaña", lugar:"la ciudad", dia:1};
  d.campana.dia = d.campana.dia || 1;
  d.facciones = d.facciones || [];
  d.npcs = d.npcs || [];
  d.hilos = d.hilos || [];
  d.sesiones = d.sesiones || [];
  d.consecuencias = d.consecuencias || [];
  for(var i=0;i<d.hilos.length;i++){
    d.hilos[i].evitadas = d.hilos[i].evitadas || [];
    d.hilos[i].vueltas = d.hilos[i].vueltas || 0;
  }
  return d;
}
